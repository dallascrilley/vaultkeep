name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run if not a [skip ci] commit
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # No registry-url here: setup-node would write an .npmrc with a
      # placeholder auth token, which preempts the OIDC trusted-publishing
      # exchange and breaks publish.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm >= 11.5.1 is required for OIDC trusted publishing
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Publishes package.json's version if the registry is behind git —
      # heals the state semantic-release leaves when the npm publish step
      # fails after the release commit and tag were already pushed.
      - name: Catch-up publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "dc-ops-cli@${V}" version >/dev/null 2>&1; then
            echo "dc-ops-cli@${V} already on npm; nothing to catch up"
          else
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
            npm publish --access public
          fi

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npx semantic-release
